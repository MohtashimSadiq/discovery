<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>German Startup Funding & Ecosystem Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">
  <div class="max-w-7xl mx-auto px-4 py-8 w-full">
    <header class="mb-8 text-center">
      <h1 class="text-4xl font-bold text-slate-900 mb-2">German Startup Program Finder</h1>
      <p class="text-slate-600 mb-2">Automated directory of active grants, accelerators, incubators, and VC funds.</p>
      <!-- User Local Time Display -->
      <div id="user-time" class="inline-block bg-slate-200 text-slate-800 text-xs font-semibold px-3 py-1 rounded-full shadow-inner">
        Loading local time...
      </div>
    </header>

    <!-- Filters & Counters Bar -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 space-y-4">
      <input type="text" id="search" placeholder="Search by program name..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <select id="filter-type" class="p-2 border border-slate-300 rounded-lg text-sm">
          <option value="">All Types (Grants, VCs...)</option>
          <option value="grant">type:grant</option>
          <option value="accelerator">type:accelerator</option>
          <option value="incubator">type:incubator</option>
          <option value="vc">type:vc</option>
          <option value="loan">type:loan</option>
        </select>

        <select id="filter-funding" class="p-2 border border-slate-300 rounded-lg text-sm">
          <option value="">All Funding Types</option>
          <option value="equity-free">funding:equity-free</option>
          <option value="zero-equity">funding:zero-equity</option>
          <option value="equity">funding:equity</option>
          <option value="subsidy">funding:subsidy</option>
          <option value="loan">funding:loan</option>
        </select>

        <select id="filter-stage" class="p-2 border border-slate-300 rounded-lg text-sm">
          <option value="">All Stages</option>
          <option value="pre-seed">stage:pre-seed</option>
          <option value="seed">stage:seed</option>
          <option value="scale">stage:scale</option>
        </select>

        <select id="filter-bmwk" class="p-2 border border-slate-300 rounded-lg text-sm">
          <option value="">BMWK Affiliation</option>
          <option value="direct">bmwk:direct</option>
          <option value="mandated">bmwk:mandated</option>
          <option value="none">bmwk:none</option>
        </select>
      </div>

      <!-- Live Program Counters -->
      <div id="counters-bar" class="pt-4 border-t border-slate-100 flex flex-wrap gap-2 text-xs font-semibold text-slate-700">
        <!-- Counters dynamically rendered via JavaScript -->
      </div>
    </div>

    <!-- Cards Grid -->
    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <!-- Footer with Contact Links and Attribution -->
  <footer class="bg-white border-t border-slate-200 py-8 mt-12 w-full">
    <div class="max-w-7xl mx-auto px-4 text-center space-y-4">
      <div class="flex flex-wrap justify-center items-center gap-6 text-sm font-medium">
        <a href="https://www.linkedin.com/in/mohtashim-sadiq/" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:text-blue-800 transition">
          LinkedIn Profile
        </a>
        <a href="https://www.instagram.com/mohtashimsadiq/" target="_blank" rel="noopener noreferrer" class="text-pink-600 hover:text-pink-800 transition">
          Instagram
        </a>
        <a href="https://cal.com/mohtashim-sadiq-sphz0o" target="_blank" rel="noopener noreferrer" class="text-emerald-600 hover:text-emerald-800 transition">
          Book an Appointment
        </a>
      </div>
      <p class="text-sm text-slate-500 font-medium">Made by Mohtashim Sadiq</p>
    </div>
  </footer>

  <script>
    let programs = [];

    // Live User Time Functionality
    function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const dateString = now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
      document.getElementById('user-time').innerText = `Your Time: ${dateString} — ${timeString}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function loadPrograms() {
      try {
        const res = await fetch('grants.json');
        programs = await res.json();
        render();
      } catch (err) {
        document.getElementById('grid').innerHTML = '<p class="text-red-500">Run the GitHub Action agent first to generate grants.json.</p>';
      }
    }

    function updateCounters(filteredPrograms) {
      const counts = {
        total: filteredPrograms.length,
        grant: 0,
        accelerator: 0,
        incubator: 0,
        vc: 0,
        loan: 0
      };

      filteredPrograms.forEach(p => {
        if (counts[p.type] !== undefined) {
          counts[p.type]++;
        }
      });

      const countersContainer = document.getElementById('counters-bar');
      countersContainer.innerHTML = `
        <span class="bg-slate-100 text-slate-800 px-3 py-1 rounded-md border border-slate-200">Total: ${counts.total}</span>
        <span class="bg-blue-50 text-blue-700 px-3 py-1 rounded-md border border-blue-200">Grants: ${counts.grant}</span>
        <span class="bg-purple-50 text-purple-700 px-3 py-1 rounded-md border border-purple-200">Accelerators: ${counts.accelerator}</span>
        <span class="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-md border border-emerald-200">Incubators: ${counts.incubator}</span>
        <span class="bg-amber-50 text-amber-700 px-3 py-1 rounded-md border border-amber-200">VCs: ${counts.vc}</span>
        <span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-md border border-indigo-200">Loans: ${counts.loan}</span>
      `;
    }

    function render() {
      const search = document.getElementById('search').value.toLowerCase();
      const type = document.getElementById('filter-type').value;
      const funding = document.getElementById('filter-funding').value;
      const stage = document.getElementById('filter-stage').value;
      const bmwk = document.getElementById('filter-bmwk').value;

      const filtered = programs.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(search);
        const matchesType = !type || p.type === type;
        const matchesFunding = !funding || p.funding === funding;
        const matchesStage = !stage || p.stage === stage;
        const matchesBmwk = !bmwk || p.bmwk === bmwk;
        return matchesSearch && matchesType && matchesFunding && matchesStage && matchesBmwk;
      });

      updateCounters(filtered);

      const grid = document.getElementById('grid');
      grid.innerHTML = filtered.map(p => `
        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between">
          <div>
            <h3 class="font-bold text-lg text-slate-900 mb-2">${p.name}</h3>
            <div class="flex flex-wrap gap-1.5 mb-3 text-xs font-medium">
              <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded">type:${p.type}</span>
              <span class="bg-green-100 text-green-800 px-2 py-0.5 rounded">funding:${p.funding}</span>
              <span class="bg-purple-100 text-purple-800 px-2 py-0.5 rounded">stage:${p.stage}</span>
              <span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded">bmwk:${p.bmwk}</span>
              <span class="bg-rose-100 text-rose-800 px-2 py-0.5 rounded">exist:${p.exist}</span>
            </div>
            <p class="text-slate-600 text-sm mb-4">${p.description}</p>
          </div>
          <div>
            <div class="text-xs text-slate-500 font-medium pt-2 border-t border-slate-100 mb-3">
              📅 Deadline: <span class="text-slate-800 font-semibold">${p.deadline ? p.deadline : 'Not stated'}</span>
            </div>
            <a href="${p.url}" target="_blank" class="block text-center bg-slate-900 text-white py-2 rounded-lg text-sm font-medium hover:bg-slate-800 transition">View Details & Apply ↗</a>
          </div>
        </div>
      `).join('');
    }

    ['search', 'filter-type', 'filter-funding', 'filter-stage', 'filter-bmwk'].forEach(id => {
      document.getElementById(id).addEventListener('input', render);
    });

    loadPrograms();
  </script>
</body>
</html>
