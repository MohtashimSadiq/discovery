<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>German Startup Funding & Ecosystem Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-200">

  <div class="max-w-7xl mx-auto px-4 py-8 w-full">
    <!-- Top Header & Theme Switcher -->
    <header class="mb-8 relative flex flex-col items-center">
      <button id="theme-toggle" onclick="toggleTheme()" class="absolute right-0 top-0 px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
        🌙 Dark Mode
      </button>

      <h1 class="text-4xl font-bold text-slate-900 dark:text-white mb-2 text-center mt-6 sm:mt-0">German Startup Program Finder</h1>
      <p class="text-slate-600 dark:text-slate-400 text-center">Automated directory of active grants, accelerators, incubators, and VC funds.</p>
    </header>

    <!-- Filters & Counters Bar -->
    <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 mb-8 space-y-4 transition-colors">
      <input type="text" id="search" placeholder="Search by program name..." class="w-full px-4 py-2 border border-slate-300 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100">
      
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <select id="filter-type" class="p-2 border border-slate-300 dark:border-slate-700 rounded-lg text-sm bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100">
          <option value="">All Types (Grants, VCs...)</option>
          <option value="grant">type:grant</option>
          <option value="accelerator">type:accelerator</option>
          <option value="incubator">type:incubator</option>
          <option value="vc">type:vc</option>
          <option value="loan">type:loan</option>
        </select>

        <select id="filter-funding" class="p-2 border border-slate-300 dark:border-slate-700 rounded-lg text-sm bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100">
          <option value="">All Funding Types</option>
          <option value="equity-free">funding:equity-free</option>
          <option value="zero-equity">funding:zero-equity</option>
          <option value="equity">funding:equity</option>
          <option value="subsidy">funding:subsidy</option>
          <option value="loan">funding:loan</option>
        </select>

        <select id="filter-stage" class="p-2 border border-slate-300 dark:border-slate-700 rounded-lg text-sm bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100">
          <option value="">All Stages</option>
          <option value="pre-seed">stage:pre-seed</option>
          <option value="seed">stage:seed</option>
          <option value="scale">stage:scale</option>
        </select>

        <select id="filter-bmwk" class="p-2 border border-slate-300 dark:border-slate-700 rounded-lg text-sm bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100">
          <option value="">BMWK Affiliation</option>
          <option value="direct">bmwk:direct</option>
          <option value="mandated">bmwk:mandated</option>
          <option value="none">bmwk:none</option>
        </select>
      </div>

      <!-- Live Counters -->
      <div id="counters-bar" class="pt-4 border-t border-slate-100 dark:border-slate-700 flex flex-wrap gap-2 text-xs font-semibold">
        <!-- Dynamically populated -->
      </div>
    </div>

    <!-- Cards Grid -->
    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <!-- Footer -->
  <footer class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-8 mt-12 w-full transition-colors">
    <div class="max-w-7xl mx-auto px-4 text-center space-y-4">
      <div class="flex flex-wrap justify-center items-center gap-6 text-sm font-medium">
        <a href="https://www.linkedin.com/in/mohtashim-sadiq/" target="_blank" rel="noopener noreferrer" class="text-blue-600 dark:text-blue-400 hover:underline">
          LinkedIn Profile
        </a>
        <a href="https://www.instagram.com/mohtashimsadiq/" target="_blank" rel="noopener noreferrer" class="text-pink-600 dark:text-pink-400 hover:underline">
          Instagram
        </a>
        <a href="https://cal.com/mohtashim-sadiq-sphz0o" target="_blank" rel="noopener noreferrer" class="text-emerald-600 dark:text-emerald-400 hover:underline">
          Book an Appointment
        </a>
      </div>
      <p class="text-sm text-slate-500 dark:text-slate-400 font-medium">Made by Mohtashim Sadiq</p>
    </div>
  </footer>

  <script>
    let programs = [];

    // Dark Mode Toggle Logic
    function toggleTheme() {
      const html = document.documentElement;
      const themeBtn = document.getElementById('theme-toggle');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        themeBtn.innerText = '🌙 Dark Mode';
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        themeBtn.innerText = '☀️ Light Mode';
      }
    }

    // Initialize Theme Choice
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      document.getElementById('theme-toggle').innerText = '☀️ Light Mode';
    }

    async function loadPrograms() {
      try {
        const res = await fetch('grants.json');
        programs = await res.json();
        render();
      } catch (err) {
        document.getElementById('grid').innerHTML = '<p class="text-red-500">Run the GitHub Action agent first to generate grants.json.</p>';
      }
    }

    function updateCounters(filteredPrograms) {
      const counts = { total: filteredPrograms.length, grant: 0, accelerator: 0, incubator: 0, vc: 0, loan: 0 };
      filteredPrograms.forEach(p => { if (counts[p.type] !== undefined) counts[p.type]++; });

      document.getElementById('counters-bar').innerHTML = `
        <span class="bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-200 px-3 py-1 rounded-md border border-slate-200 dark:border-slate-600">Total: ${counts.total}</span>
        <span class="bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-300 px-3 py-1 rounded-md border border-blue-200 dark:border-blue-800">Grants: ${counts.grant}</span>
        <span class="bg-purple-50 dark:bg-purple-950 text-purple-700 dark:text-purple-300 px-3 py-1 rounded-md border border-purple-200 dark:border-purple-800">Accelerators: ${counts.accelerator}</span>
        <span class="bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 px-3 py-1 rounded-md border border-emerald-200 dark:border-emerald-800">Incubators: ${counts.incubator}</span>
        <span class="bg-amber-50 dark:bg-amber-950 text-amber-700 dark:text-amber-300 px-3 py-1 rounded-md border border-amber-200 dark:border-amber-800">VCs: ${counts.vc}</span>
        <span class="bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 px-3 py-1 rounded-md border border-indigo-200 dark:border-indigo-800">Loans: ${counts.loan}</span>
      `;
    }

    function formatDeadlineBadge(deadline) {
      if (!deadline || deadline.toLowerCase() === 'not stated') {
        return `<span class="inline-block px-2.5 py-1 rounded-md text-xs font-medium bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">📅 Deadline: Not stated</span>`;
      }
      const lower = deadline.toLowerCase();
      if (lower === 'ongoing') {
        return `<span class="inline-block px-2.5 py-1 rounded-md text-xs font-semibold bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">🟢 Ongoing</span>`;
      }
      if (lower === 'closed') {
        return `<span class="inline-block px-2.5 py-1 rounded-md text-xs font-semibold bg-rose-100 dark:bg-rose-950 text-rose-800 dark:text-rose-300 border border-rose-200 dark:border-rose-800">🔴 Closed</span>`;
      }
      return `<span class="inline-block px-2.5 py-1 rounded-md text-xs font-semibold bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800">📅 Deadline: ${deadline}</span>`;
    }

    function render() {
      const search = document.getElementById('search').value.toLowerCase();
      const type = document.getElementById('filter-type').value;
      const funding = document.getElementById('filter-funding').value;
      const stage = document.getElementById('filter-stage').value;
      const bmwk = document.getElementById('filter-bmwk').value;

      const filtered = programs.filter(p => {
        return p.name.toLowerCase().includes(search) &&
          (!type || p.type === type) &&
          (!funding || p.funding === funding) &&
          (!stage || p.stage === stage) &&
          (!bmwk || p.bmwk === bmwk);
      });

      updateCounters(filtered);

      document.getElementById('grid').innerHTML = filtered.map(p => `
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition flex flex-col justify-between">
          <div>
            <h3 class="font-bold text-lg text-slate-900 dark:text-white mb-2">${p.name}</h3>
            <div class="flex flex-wrap gap-1.5 mb-3 text-xs font-medium">
              <span class="bg-blue-100 dark:bg-blue-900/60 text-blue-800 dark:text-blue-300 px-2 py-0.5 rounded">type:${p.type}</span>
              <span class="bg-green-100 dark:bg-green-900/60 text-green-800 dark:text-green-300 px-2 py-0.5 rounded">funding:${p.funding}</span>
              <span class="bg-purple-100 dark:bg-purple-900/60 text-purple-800 dark:text-purple-300 px-2 py-0.5 rounded">stage:${p.stage}</span>
              <span class="bg-amber-100 dark:bg-amber-900/60 text-amber-800 dark:text-amber-300 px-2 py-0.5 rounded">bmwk:${p.bmwk}</span>
              <span class="bg-rose-100 dark:bg-rose-900/60 text-rose-800 dark:text-rose-300 px-2 py-0.5 rounded">exist:${p.exist}</span>
            </div>
            <p class="text-slate-600 dark:text-slate-300 text-sm mb-4">${p.description}</p>
          </div>
          <div>
            <div class="pt-3 border-t border-slate-100 dark:border-slate-700 mb-3">
              ${formatDeadlineBadge(p.deadline)}
            </div>
            <a href="${p.url}" target="_blank" class="block text-center bg-slate-900 hover:bg-slate-800 dark:bg-slate-700 dark:hover:bg-slate-600 text-white py-2 rounded-lg text-sm font-medium transition">View Details & Apply ↗</a>
          </div>
        </div>
      `).join('');
    }

    ['search', 'filter-type', 'filter-funding', 'filter-stage', 'filter-bmwk'].forEach(id => {
      document.getElementById(id).addEventListener('input', render);
    });

    loadPrograms();
  </script>
</body>
</html>
